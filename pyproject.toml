[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinresearch-ai"
version = "0.1.0"
description = "Synthetic EHR research analytics — not clinically validated"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "streamlit>=1.40,<2",
  "plotly>=5.24,<7", "pydantic>=2.9,<3", "requests>=2.32,<3",
  "scikit-learn>=1.6,<1.8", "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
clinresearch = "clinresearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
