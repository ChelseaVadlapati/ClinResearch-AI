name: clinresearch
x-app: &app
  build: .
  image: clinresearch-ai:local
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clinresearch}:${POSTGRES_PASSWORD:?Generate .env using scripts/init_env.py}@db:5432/${POSTGRES_DB:-clinresearch}
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinresearch}
      POSTGRES_DB: ${POSTGRES_DB:-clinresearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env using scripts/init_env.py}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  ingest:
    <<: *app
    command: ["clinresearch", "ingest", "/app/tests/fixtures/synthea", "--report", "/app/reports/demo.json"]
    volumes:
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    volumes:
      - ./reports:/app/reports:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
  dashboard:
    build: .
    image: clinresearch-ai:local
    environment:
      API_BASE_URL: http://api:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    command: ["streamlit", "run", "src/clinresearch/dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
