name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinresearch_test
          POSTGRES_USER: postgres
          # Ephemeral isolated CI service only; no committed credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/clinresearch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check --diff .
      - run: pytest

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: clinresearch-ci
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/init_env.py
      - name: Start isolated services without building an application image
        run: docker compose up --no-build -d --wait --wait-timeout 300
      - name: Verify dashboard can reach its internal API
        run: |
          docker compose exec -T dashboard python -c 'import os, requests; r = requests.get(os.environ["API_BASE_URL"] + "/cohort/summary", timeout=10); r.raise_for_status(); assert r.json()["counts"]["patients"] == 3'
      - name: Existing dashboard smoke checks
        run: python scripts/smoke_demo.py
      - name: Generate a new fixture research artifact
        run: |
          docker compose run --rm --no-deps ingest python -m clinresearch.cli analyze \
            --observation-end 2025-01-01 --split-date 2024-01-01 \
            --output /app/reports/research
          python scripts/smoke_research.py
          docker compose run --rm --no-deps ingest python -m clinresearch.cli analyze \
            --observation-end 2025-01-01 --split-date 2024-01-01 \
            --config /app/configs/adult-return-v1.json --output /app/reports/research-config
          python -c 'import json; r=json.load(open("reports/research-config/report.json")); assert r["evaluation"]["status"] == "insufficient_data"; assert r["study_config"]["min_partition_patients"] == 100'
      - name: Import FHIR without mixing populations
        run: |
          docker compose run --rm --no-deps -e DATABASE_URL=sqlite:////app/reports/fhir-ci.db ingest \
            python -m clinresearch.cli ingest-fhir tests/fixtures/fhir/bundle.json \
            --dataset fictional-v1 --synthetic-only --report /app/reports/fhir-ci.json
          docker compose run --rm --no-deps -e DATABASE_URL=sqlite:////app/reports/fhir-ci.db ingest \
            python -m clinresearch.cli ingest-fhir tests/fixtures/fhir/bundle.json \
            --dataset fictional-v1 --synthetic-only --report /app/reports/fhir-repeat.json
          python -c 'import json; r=json.load(open("reports/fhir-repeat.json")); assert all(v == {"inserted": 0, "updated": 0} for v in r["changes"].values())'
      - name: Preserve smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-evidence
          path: reports/
      - name: Container diagnostics
        if: always()
        run: docker compose ps -a && docker compose logs --tail=40

  nlp-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-nlp.lock
      - run: python -m pip install --require-hashes -r requirements-nlp.lock
      - run: python -m pip install --no-deps -e .
      - uses: actions/cache@v4
        with:
          path: data/models/minilm-v1
          key: minilm-${{ hashFiles('benchmarks/nlp/model-lock.json') }}
      - name: Evaluate pinned frozen encoder on synthetic holdout
        run: |
          python -m clinresearch.nlp.benchmark --output reports/nlp \
            --model-lock benchmarks/nlp/model-lock.json \
            --cache data/models/minilm-v1 --download-model
          python -c 'import json; r=json.load(open("reports/nlp/report.json")); assert r["transformer_status"] == "evaluated"; assert r["test_examples"] == 24'
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-nlp-evaluation
          path: reports/nlp/report.json
